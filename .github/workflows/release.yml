name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Required for manual release."
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    working-directory: software/python

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: software/python/requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller DKUScope.spec --noconfirm --clean

      - name: Copy default config into bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/DKUScope/config | Out-Null
          Copy-Item config/project_config.json dist/DKUScope/config/project_config.json

      - name: Create release zip
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          Compress-Archive -Path dist/DKUScope -DestinationPath "dist/DKUScope-${tag}-windows.zip" -Force

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DKUScope ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            software/python/dist/DKUScope-${{ steps.version.outputs.tag }}-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
