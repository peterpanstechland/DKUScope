name: Release

on:
  push:
    branches: [main, master]
    paths:
      - "software/python/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0). Leave empty to auto-generate v0.1.<run>."
        required: false
        type: string

permissions:
  contents: write

defaults:
  run:
    working-directory: software/python

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version tag
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp build version
        shell: python
        run: |
          import pathlib
          import re
          tag = "${{ steps.version.outputs.tag }}"
          ver = tag.lstrip("v")
          path = pathlib.Path("control_station/__init__.py")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r'__version__ = "[^"]*"', f'__version__ = "{ver}"', text)
          path.write_text(text, encoding="utf-8")

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: software/python/requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller DKUScope.spec --noconfirm --clean

      - name: Copy default config into bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/DKUScope/config | Out-Null
          Copy-Item config/project_config.json dist/DKUScope/config/project_config.json

      - name: Create release zip
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          Compress-Archive -Path dist/DKUScope -DestinationPath "dist/DKUScope-${tag}-windows.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DKUScope ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            software/python/dist/DKUScope-${{ steps.version.outputs.tag }}-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
