name: Build

on:
  push:
    branches: [main, master]
    paths:
      - "software/python/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "software/python/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: software/python

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: software/python/requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller DKUScope.spec --noconfirm --clean

      - name: Copy default config into bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/DKUScope/config | Out-Null
          Copy-Item config/project_config.json dist/DKUScope/config/project_config.json

      - name: Create zip artifact
        shell: pwsh
        run: Compress-Archive -Path dist/DKUScope -DestinationPath dist/DKUScope.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DKUScope-windows
          path: software/python/dist/DKUScope.zip
          retention-days: 14
